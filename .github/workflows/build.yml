name: Build Sparrow App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sparrow-windows
            asset_name: sparrow_setup.exe
          - os: macos-latest
            artifact_name: sparrow-macos
            asset_name: sparrow_macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Application
        shell: bash
        run: |
          mkdir -p build_output
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            go build -ldflags="-H windowsgui" -o sparrow_setup.exe .
          else
            go build -o sparrow_macos .
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            sparrow_setup.exe
            sparrow_macos
