name: Build SPARROW

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up MinGW (C compiler)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify GCC
        run: gcc --version
        shell: cmd

      - name: Download Go dependencies
        run: go mod download
        shell: cmd

      - name: Build BEAST.exe
        run: go build -ldflags="-s -w" -o BEAST.exe .
        shell: cmd
        env:
          CGO_ENABLED: 1

      - name: Upload BEAST.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEAST-Windows
          path: BEAST.exe
